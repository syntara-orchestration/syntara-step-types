apiVersion: syntara.io/v1alpha1
kind: Action
metadata:
  name: script
  displayName: Script
  description: Runs Python or Bash code in an isolated subprocess container.
spec:
  runtime:
    kind: custom-runner
    entryPoint: "syntara_node_script:ScriptStep"
  input:
    kind: inline
    value:
      type: object
      required:
        - language
        - code
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [python, bash]
          description: Script language to execute.
        code:
          type: string
          minLength: 1
          description: Script source code to execute.
        environment:
          type: object
          additionalProperties:
            type: string
          description: Environment variables passed to the script process.
        max_output_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
          default: 276480
          description: Maximum bytes captured per output stream (1 to 1048576). Output beyond this limit is truncated. Defaults to ~270 KB per stream; the combined serialized result must not exceed the 1 MiB SDK ABI limit.
  output:
    kind: inline
    value:
      type: object
      required: [return_code, stdout, stderr]
      additionalProperties: false
      properties:
        return_code:
          type: integer
          description: Process exit code.
        stdout:
          type: string
          description: Standard output captured from the script.
        stderr:
          type: string
          description: Standard error captured from the script.
        stdout_json:
          description: Parsed JSON from stdout (Python scripts only).
  error:
    kind: inline
    value:
      type: object
      additionalProperties: true
