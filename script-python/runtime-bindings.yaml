apiVersion: syntara.io/v1alpha1
kind: RuntimeBinding
metadata:
  namespace: syntara
  name: script-python-runtime
spec:
  plugin:
    source: plugin.yaml
  workloads:
    script-python:
      default: default
      options:
        - name: default
          displayName: Default runtime
          description: Container image built from this plugin's Containerfile.
          runtime:
            components:
              - name: python
                executable: /usr/bin/python3.12
          image:
            buildTarget: script-python
