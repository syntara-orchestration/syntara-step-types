apiVersion: syntara.io/v1alpha1
kind: RuntimeBinding
metadata:
  namespace: syntara
  name: script-python-runtime
spec:
  plugin:
    source: plugin.yaml
  workloads:
    script-python:
      default: default
      options:
        - name: default
          displayName: Default runtime
          description: Container image built from this plugin's Containerfile.
          image:
            buildTarget: script-python
