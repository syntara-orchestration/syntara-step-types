requires-python = ">=3.12,<3.15"
dependencies = ["syntara-plugin-contracts>=0.1.0a2", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_node_script"]
