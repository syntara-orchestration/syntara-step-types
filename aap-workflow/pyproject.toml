[project]
name = "syntara-node-aap-workflow"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["syntara-plugin-contracts>=0.1.0a6", "httpx>=0.28", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_node_aap_workflow"]
include = ["manifest.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.yaml" = "syntara_node_aap_workflow/manifest.yaml"
"src/syntara_node_aap_workflow/integration.yaml" = "syntara_node_aap_workflow/integration.yaml"
"src/syntara_node_aap_workflow/aap-credential.yaml" = "syntara_node_aap_workflow/aap-credential.yaml"
