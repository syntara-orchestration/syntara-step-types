apiVersion: syntara.io/v1alpha1
kind: RuntimeBinding
metadata:
  namespace: syntara
  name: aap-workflow-runtime
spec:
  plugin:
    source: plugin.yaml
  workloads:
    aap-workflow:
      default: default
      options:
        - name: default
          displayName: Default runtime
          description: Container image built from this plugin's Containerfile.
          image:
            buildTarget: aap-workflow
