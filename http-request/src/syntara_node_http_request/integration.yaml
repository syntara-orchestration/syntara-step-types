apiVersion: syntara.io/v1alpha1
kind: IntegrationType
metadata:
  name: http
  displayName: HTTP Service
  description: Generic HTTP connection for the HTTP Request step.
spec:
  id: syntara.http
  endpointKinds: [http, https]
  credentialTypes: [syntara.http.bearer]
  configuration:
    kind: inline
    value:
      type: object
      additionalProperties: false
