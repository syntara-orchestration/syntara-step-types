[project]
name = "syntara-node-http-request"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["syntara-plugin-runtime>=0.1.0", "httpx>=0.28", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_node_http_request"]
include = ["manifest.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.yaml" = "syntara_node_http_request/manifest.yaml"
