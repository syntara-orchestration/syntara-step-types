[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "syntara-script-step"
version = "0.1.0"
dependencies = [
    "syntara-plugin-contracts>=0.1.0a1",
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["script_step"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "script_step/manifests/plugin.yaml"
"steps" = "script_step/manifests/steps"
"schemas" = "script_step/manifests/schemas"
