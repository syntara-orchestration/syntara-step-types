name: Nodes CI

on:
  pull_request:
  push:
    branches: [devel]
  merge_group:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodes-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.12.3'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: make install
      - run: make lint typecheck check-generated check-konflux

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: make install
        env:
          UV_PYTHON: ${{ matrix.python }}
      - run: make test-ci
        env:
          UV_PYTHON: ${{ matrix.python }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-python-${{ matrix.python }}
          path: test-results/
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTAINER_ENGINE: docker
      TAG: ci-${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      VCS_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: make install
      # Keep the available images together: the smoke client uses the script image.
      - run: make node-images
      - run: make smoke-images

  nodes-ci:
    name: nodes-ci
    if: always()
    needs: [quality, tests, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          IMAGE_RESULT: ${{ needs.images.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$IMAGE_RESULT" = success
