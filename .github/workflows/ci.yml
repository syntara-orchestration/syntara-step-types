name: Steps CI

on:
  pull_request:
  push:
    branches: [devel]
  merge_group:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steps-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.5.x'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: step-types
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: make install
        working-directory: step-types
      - run: make lint typecheck sdk-plugin-drift
        working-directory: step-types

  unit-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: step-types
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: make install
        working-directory: step-types
        env:
          UV_PYTHON: ${{ matrix.python }}
      - run: make test-ci
        working-directory: step-types
        env:
          UV_PYTHON: ${{ matrix.python }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-results-${{ matrix.os }}-python-${{ matrix.python }}
          path: step-types/test-results/
          retention-days: 7

  image-tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: step-types
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman
      - run: make install
        working-directory: step-types
      - name: Build all step images with the SDK
        run: make test-build
        working-directory: step-types
      - name: Test image gRPC front doors
        run: make test-integration-ci
        working-directory: step-types
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-test-results-${{ matrix.platform }}
          path: |
            step-types/.test-artifacts/
            step-types/test-results/
          retention-days: 7

  steps-ci:
    name: steps-ci
    if: always()
    needs: [quality, unit-tests, image-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all test gates to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          IMAGE_RESULT: ${{ needs.image-tests.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$IMAGE_RESULT" = success
