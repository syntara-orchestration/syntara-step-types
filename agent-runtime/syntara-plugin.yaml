apiVersion: syntara.io/v1alpha1
kind: PluginBuildSettings
manifest: plugin.yaml
registry:
  origin: http://localhost:5000
  artifactRepository: syntara/plugins/agent-runtime
  workloadRepository: syntara/workloads/agent-runtime
  catalogRepository: syntara/catalog-index
  username: publisher
  allowInsecureLoopbackHttp: true
build:
  artifactOutput: dist/agent-runtime.oci.tar
  runtimeBindings: runtime-bindings.yaml
  workloads:
    agent-runtime:
      engine: podman
      context: ..
      containerfile: Containerfile
      tag: 0.1.0
      platform: linux/amd64
      runtimeMetadata:
        language: python
        version: "3.12.16"
publish:
  channel: 0.1.0
  updateCatalog: true
catalog:
  sourceId: syntara-catalog
  channel: stable
  expiresInHours: 168
