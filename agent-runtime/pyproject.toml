[project]
name = "syntara-node-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["syntara-plugin-contracts>=0.1.0a7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_node_agent_runtime"]
include = ["manifest.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.yaml" = "syntara_node_agent_runtime/manifest.yaml"
