[project]
name = "syntara-step-types"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "syntara-plugin-contracts>=0.1.0a4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff==0.14.3",
    "mypy>=1.8",
    "pyyaml>=6.0.3",
    "types-PyYAML>=6.0",
    "syntara-plugin-sdk>=0.1.0a4",
]

[tool.uv.workspace]
members = ["script-runtime", "http-request"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["script-runtime/tests", "http-request/tests", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: integration tests requiring container runtime (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["syntara_plugin.*", "grpc.*", "respx.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["syntara_node_http_request", "syntara_node_script"]

[tool.coverage.report]
show_missing = true
