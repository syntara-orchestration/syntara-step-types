[project]
name = "syntara-nodes"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7,<8",
    "ruff==0.14.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "mypy>=1.8",
    "types-PyYAML",
    "grpcio-tools==1.78.0",
    "types-protobuf>=6,<7",
    "grpc-stubs>=1.53.0.6",
    "mypy-protobuf>=3.6,<4",
]

[tool.uv.workspace]
members = ["_protocol", "_shared", "http-request", "script", "agent", "aap-job", "aap-workflow"]

[tool.uv.sources]
syntara-node-runtime = { workspace = true }
syntara-node-protocol = { workspace = true }
syntara-sdk = { git = "https://github.com/syntara-orchestration/syntara-node-sdk.git", rev = "b1398927636a1442e59afac6627fcebd6f2a4647", subdirectory = "sdk-python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "http-request/tests", "script/tests", "agent/tests", "aap-job/tests", "aap-workflow/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
follow_imports = "silent"
python_version = "3.12"
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["syntara_sdk.*", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["syntara_sdk.*"]
follow_untyped_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py", "*_pb2_grpc.pyi"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "PLR0913", "TRY300", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tools/**/*.py" = ["T201", "INP001", "PLC0415", "ARG001", "ANN401", "TRY003", "EM102"]
"**/tests/**/*.py" = [
    "S101", "ANN001", "ANN201", "D102", "D103", "PLR2004", "TD002", "TD003",
    "ARG001", "ARG002", "SLF001", "PERF401", "S110", "BLE001", "SIM105", "PLC0415",
    "D401", "PT011", "PT012", "PGH003", "SIM117", "INP001", "ARG005", "ANN003", "S603",
]

[tool.coverage.run]
source = ["syntara_node_runtime", "syntara_node_protocol", "syntara_node_http_request", "syntara_node_script", "syntara_node_agent", "syntara_node_aap_job", "syntara_node_aap_workflow"]
omit = ["*/node_pb2*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
