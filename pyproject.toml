[project]
name = "syntara-step-types"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff==0.14.3",
    "mypy>=1.8",
]

[tool.uv.workspace]
members = ["script", "http-request"]

[tool.uv.sources]
syntara-plugin-runtime = { path = "../syntara-plugin-sdk/sdks/python/packages/runtime", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["script/tests", "http-request/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
