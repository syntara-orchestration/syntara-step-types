apiVersion: syntara.io/v1alpha1
kind: Action
metadata:
  name: script-bash
  displayName: Bash Script
  description: Runs Bash code in an isolated subprocess container.
spec:
  runtime:
    kind: custom-runner
    entryPoint: "syntara_node_script:BashScriptStep"
  input:
    kind: inline
    value:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          description: Bash source code to execute.
        environment:
          type: object
          additionalProperties:
            type: string
          description: Environment variables passed to the Bash process.
        max_output_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
          default: 276480
          description: Maximum bytes captured per output stream (1 to 1048576). Output beyond this limit is truncated. Defaults to ~270 KB per stream; the combined serialized result must not exceed the 1 MiB SDK ABI limit.
  output:
    kind: inline
    value:
      type: object
      required: [return_code, stdout, stderr]
      additionalProperties: false
      properties:
        return_code:
          type: integer
          description: Process exit code.
        stdout:
          type: string
          description: Standard output captured from the Bash process.
        stderr:
          type: string
          description: Standard error captured from the Bash process.
  error:
    kind: inline
    value:
      type: object
      additionalProperties: true
