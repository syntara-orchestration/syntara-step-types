[project]
name = "syntara-node-aap-job-template"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["syntara-plugin-contracts>=0.1.0a5", "httpx>=0.28", "pyyaml>=6.0", "pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_node_aap_job_template"]
include = ["manifest.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.yaml" = "syntara_node_aap_job_template/manifest.yaml"
"src/syntara_node_aap_job_template/integration.yaml" = "syntara_node_aap_job_template/integration.yaml"
"src/syntara_node_aap_job_template/aap-credential.yaml" = "syntara_node_aap_job_template/aap-credential.yaml"
