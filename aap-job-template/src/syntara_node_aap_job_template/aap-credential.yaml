apiVersion: syntara.io/v1alpha1
kind: CredentialRecipe
metadata:
  name: aap-auth
  displayName: AAP API Authentication
  description: OAuth token or username and password for Ansible Automation Platform.
spec:
  id: syntara.aap.auth
  integrationType: ansible_automation_platform
  credentialSchema:
    kind: inline
    value:
      type: object
      additionalProperties: false
      oneOf:
        - required: [oauth_token]
        - required: [username, password]
      properties:
        oauth_token:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
  secretFields: [oauth_token, password]
  issuance:
    kind: static-bearer.v1
